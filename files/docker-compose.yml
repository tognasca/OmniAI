version: '3.9'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: omni_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd
        -S localhost -U SA -P "YourStrong!Passw0rd"
        -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: omni_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/OmniAI.API/Dockerfile
    container_name: omni_api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_RUNNING_IN_CONTAINER: "true"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=OmniAI;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=True;Connection Timeout=30;"
      OpenAI__ApiKey: "${OPENAI_API_KEY:-sk-placeholder}"
      WhatsApp__VerifyToken: "${WA_VERIFY_TOKEN:-omni_verify_dev}"
      Encryption__Key: "${AES_KEY:-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=}"
      Encryption__IV: "${AES_IV:-AAAAAAAAAAAAAAAAAAAAAA==}"
      Auth__Authority: "${AUTH_AUTHORITY:-}"
      Auth__Audience: "omni-ai-api"
    volumes:
      - dataprotection_keys:/app/keys
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure:3

volumes:
  sqlserver_data:
  redis_data:
  dataprotection_keys:
